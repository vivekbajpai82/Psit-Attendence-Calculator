<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSIT Attendance Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>PSIT Attendance Calculator</h1>
        <input type="number" id="totalLectures" placeholder="Total Lectures">
        <input type="number" id="totalAbsent" placeholder="Total Absent">
        <input type="number" id="totalOAA" placeholder="Total OAA">
        <button onclick="calculateAttendance()">Calculate Attendance</button>

        <div class="result-container">
            <div class="result" id="result"></div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="leave-result" id="leaveResult"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
